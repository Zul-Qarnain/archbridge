<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0f1f38" />
      <stop offset="60%" stop-color="#080f1d" />
      <stop offset="100%" stop-color="#03060b" />
    </radialGradient>

    <!-- Arch Blue Neon Gradient -->
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Arch Inner Shading -->
    <linearGradient id="innerGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#034d75" />
    </linearGradient>

    <!-- Bridge Deck Neon Gradient -->
    <linearGradient id="deckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Node Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#1e3a5f" stroke-width="6" />

  <!-- Subtle Inner Ring -->
  <rect x="34" y="34" width="444" height="444" rx="94" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Glow under the Arch -->
  <ellipse cx="256" cy="330" rx="160" ry="40" fill="#0ea5e9" opacity="0.18" filter="url(#glow)" />

  <!-- Vertical Suspension Cable Lines from Arch Apex to Bridge Deck -->
  <g stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35">
    <line x1="256" y1="96" x2="256" y2="330" />
    <line x1="226" y1="170" x2="180" y2="330" />
    <line x1="286" y1="170" x2="332" y2="330" />
    <line x1="206" y1="230" x2="130" y2="330" />
    <line x1="306" y1="230" x2="382" y2="330" />
  </g>

  <!-- Arch Linux Primary Swoop Silhouette / Pylon -->
  <!-- Outer Arch Curve -->
  <path d="M 256 80
           C 248 110 200 230 140 340
           C 170 326 210 320 256 320
           C 302 320 342 326 372 340
           C 312 230 264 110 256 80 Z"
        fill="url(#innerGrad)" opacity="0.75" />

  <!-- Left Sweeping Arch Wing (Arch Linux style apex) -->
  <path d="M 256 80
           C 250 100 216 195 186 265
           C 204 252 230 244 256 244
           C 220 270 170 306 106 390
           C 152 360 204 345 256 345
           C 190 280 230 160 256 80 Z"
        fill="url(#archGrad)" />

  <!-- Right Sweeping Arch Wing -->
  <path d="M 256 80
           C 262 100 296 195 326 265
           C 308 252 282 244 256 244
           C 292 270 342 306 406 390
           C 360 360 308 345 256 345
           C 322 280 282 160 256 80 Z"
        fill="url(#archGrad)" opacity="0.9" />

  <!-- Bridge Roadway / Deck Piercing Through -->
  <!-- Lower Deck Shadow / Base -->
  <path d="M 72 334 L 440 334 L 420 350 L 92 350 Z" fill="#0c1a2d" stroke="#1e3a5f" stroke-width="2" />
  
  <!-- Glowing Bridge Deck Highway Line -->
  <line x1="68" y1="332" x2="444" y2="332" stroke="url(#deckGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <line x1="80" y1="332" x2="432" y2="332" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Crossbeams on Bridge Deck (perspective truss ties) -->
  <g stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6">
    <line x1="130" y1="332" x2="140" y2="348" />
    <line x1="180" y1="332" x2="186" y2="348" />
    <line x1="256" y1="332" x2="256" y2="348" />
    <line x1="332" y1="332" x2="326" y2="348" />
    <line x1="382" y1="332" x2="372" y2="348" />
  </g>

  <!-- Central Bridge Portal Gateway / Keystone Cube (translating package) -->
  <g transform="translate(256, 300)">
    <!-- Glowing Diamond Package Icon -->
    <polygon points="0,-24 22,-8 22,18 0,32 -22,18 -22,-8"
             fill="#0b1728" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
    <!-- Inner faceted lines -->
    <line x1="0" y1="-24" x2="0" y2="32" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
    <line x1="0" y1="-8" x2="-22" y2="-8" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
    <line x1="0" y1="-8" x2="22" y2="-8" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
    <circle cx="0" cy="-8" r="4" fill="#ffffff" filter="url(#glow)" />
  </g>

  <!-- Glowing Cable Nodes -->
  <circle cx="256" cy="82" r="5" fill="#ffffff" filter="url(#glow)" />
  <circle cx="180" cy="332" r="4" fill="#38bdf8" />
  <circle cx="256" cy="332" r="4" fill="#ffffff" />
  <circle cx="332" cy="332" r="4" fill="#38bdf8" />
</svg>

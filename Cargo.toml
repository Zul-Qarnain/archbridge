[package]
name = "archbridge"
version = "0.4.0"
edition = "2021"

description = "Finds and builds the safest available installation path for software on Arch"
license = "MIT"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
toml = "0.8"
tempfile = "3"
gpui = "0.2.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
